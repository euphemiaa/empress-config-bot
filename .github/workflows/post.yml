name: امپرس | پست کانفیگ‌ها

on:
  # ⚡ هر push به master (به‌جز state و مستندات) یک ران فوری هم راه می‌اندازد
  # تا استقرارِ تغییرات بلافاصله در کانال قابل راستی‌آزمایی باشد.
  push:
    branches: [master]
    paths-ignore:
      - "state/**"
      - "**.md"
  schedule:
    # ⚠️ کرون گیت‌هاب همیشه با ساعت UTC است (تهران = UTC+3:30 و دی‌سایور ندارد)
    # هر ۹۰ دقیقه یک اجرا = ۱۶ پست در روز (دو خط کرون: نوبت اول دقیقه 23، نوبت دوم دقیقه 53)
    #   ساعت‌های تهران: 00:53، 02:23، 03:53، 05:23، 06:53، 08:23، 09:53، 11:23،
    #                   12:53، 14:23، 15:53، 17:23، 18:53، 20:23، 21:53، 23:23
    # عمداً روی دقیقه ۰ نیستیم چون گیت‌هاب سر دقیقه ۰ شلوغ است و ران‌ها بیشتر drop می‌شوند.
    - cron: "23 0,3,6,9,12,15,18,21 * * *"
    - cron: "53 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فقط پیش‌نمایش (بدون ارسال به کانال)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: empress-post
  # اگر رانی گیر کرد یا منتظر رانر ماند، رانِ بعدی آن را کنسل می‌کند تا صف هرگز بلاک نشود.
  cancel-in-progress: true

jobs:
  post:
    name: دریافت، تست و پست کانفیگ‌ها
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: دریافت کد از ریپو
        uses: actions/checkout@v4

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔥 موتور تست واقعی: برای هر کاندیدا یک پروسهٔ xray بالا می‌آید و HTTP
      # واقعی از داخل تونل رد می‌شود؛ کانفیگ‌های «پورت باز ولی مُرده» حذف می‌شوند.
      # 🛡 مقاوم‌سازی: ۳ بار تلاش + نسخهٔ پین‌شدهٔ جایگزین + در بدترین حالت
      #    ران با تست TCP ادامه پیدا می‌کند (continue-on-error) و پست قطع نمی‌شود.
      - name: دانلود موتور Xray برای تست واقعی پروتکل
        continue-on-error: true
        run: |
          mkdir -p bin
          ok=0
          for url in \
            "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip"; do
            for i in 1 2 3; do
              echo "تلاش دانلود Xray (نوبت $i) از: $url"
              if curl -fL --retry 2 --retry-delay 3 -o /tmp/xray.zip "$url"; then
                if unzip -o -q /tmp/xray.zip xray -d bin; then
                  chmod +x bin/xray
                  ok=1
                  break
                fi
              fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then break; fi
          done
          if [ "$ok" = "1" ]; then
            bin/xray version | head -1
          else
            echo "⚠️ دانلود Xray نشد؛ این ران فقط با تست TCP اجرا می‌شود (پست همچنان ارسال می‌شود)."
          fi

      - name: اجرای ربات (خروجی در run_output.log ذخیره می‌شود)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          WORKERS: "120"
          XRAY_WORKERS: "60"
          XRAY_TEST_LIMIT: "300"
        run: |
          set -o pipefail
          python main.py 2>&1 | tee run_output.log

      # 🔍 اگر هر چیزی شکست خورد، دلیلش در state/error.json در ریپو ثبت می‌شود
      # تا بدون دسترسی به لاگ Actions هم بتوانیم مشکل را از خود ریپو تشخیص دهیم.
      - name: ثبت گزارش خطا در ریپو (فقط هنگام شکست)
        if: failure()
        run: |
          git config user.name "empress-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p state
          python3 - <<'PY'
          import json, os, datetime, pathlib
          tail = ""
          p = pathlib.Path("run_output.log")
          if p.exists():
              tail = p.read_text(encoding="utf-8", errors="replace")[-3000:]
          data = {
              "failed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "output_tail": tail,
          }
          pathlib.Path("state/error.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=1), encoding="utf-8")
          PY
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git add state/error.json
          if git diff --cached --quiet; then
            echo "خطای جدیدی برای ثبت نبود."
          else
            git commit -m "ثبت گزارش خطای ران [skip ci]"
            git push || true
          fi

      - name: کامیت کردن فایل state (با [skip ci])
        if: ${{ !(inputs.dry_run) }}
        run: |
          git config user.name "empress-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git add state/
          if git diff --cached --quiet; then
            echo "تغییری در state نبود؛ چیزی برای کامیت نیست."
          else
            git commit -m "به‌روزرسانی state [skip ci]"
            git push
          fi
