name: امپرس | پست کانفیگ‌ها

on:
  schedule:
    # ⚠️ کرون گیت‌هاب همیشه با ساعت UTC است (تهران = UTC+3:30 و دی‌سایور ندارد)
    # هر ۹۰ دقیقه یک اجرا = ۱۶ پست در روز (دو خط کرون: نوبت اول دقیقه 23، نوبت دوم دقیقه 53)
    #   ساعت‌های تهران: 00:53، 02:23، 03:53، 05:23، 06:53، 08:23، 09:53، 11:23،
    #                   12:53، 14:23، 15:53، 17:23، 18:53، 20:23، 21:53، 23:23
    # عمداً روی دقیقه ۰ نیستیم چون گیت‌هاب سر دقیقه ۰ شلوغ است و ران‌ها بیشتر drop می‌شوند.
    - cron: "23 0,3,6,9,12,15,18,21 * * *"
    - cron: "53 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فقط پیش‌نمایش (بدون ارسال به کانال)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: empress-post
  cancel-in-progress: false

jobs:
  post:
    name: دریافت، تست و پست کانفیگ‌ها
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: دریافت کد از ریپو
        uses: actions/checkout@v4

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: اجرای ربات
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python main.py

      - name: کامیت کردن فایل state (با [skip ci])
        if: ${{ !(inputs.dry_run) }}
        run: |
          git config user.name "empress-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git add state/
          if git diff --cached --quiet; then
            echo "تغییری در state نبود؛ چیزی برای کامیت نیست."
          else
            git commit -m "به‌روزرسانی state [skip ci]"
            git push
          fi
